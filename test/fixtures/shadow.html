<!doctype html>
<meta charset="utf-8">
<title>Shadow DOM fixture</title>
<script src="../../src/isagent.js"></script>
<script>window.detector = isagent.start({ environment: false });</script>
<body>
<x-field id="host"></x-field>
<script>
  customElements.define("x-field", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML = '<label>City <input id="inner" name="city"></label>';
    }
  });
</script>
</body>
