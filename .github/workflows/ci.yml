name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch browser changes

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code dist/ || (echo "dist/ is out of date - run npm run build" && exit 1)
      - run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
